name: Release on tag

# Synced from twostone/meal-planner (.github/integration-mirror/workflows), do not edit here.
# HACS installs from GitHub releases; the release notes are the message of the annotated tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release aus dem Tag anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git tag -l --format='%(contents)' "${TAG}" > /tmp/notes.md
          gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/notes.md --verify-tag
