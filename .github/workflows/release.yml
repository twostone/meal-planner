name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Opens/updates one release PR per package from the conventional commits (by changed path):
  # the add-on (meal-planner/, tag vX.Y.Z) and the HA integration (custom_components/meal_planner/,
  # tag integration-vX.Y.Z). Merging a PR bumps the version, writes the CHANGELOG, tags and creates
  # the GitHub release.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      addon_released: ${{ steps.rp.outputs['meal-planner--release_created'] }}
      integration_released: ${{ steps.rp.outputs['custom_components/meal_planner--release_created'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Resources created with GITHUB_TOKEN do not trigger other workflows, so tests and the image build
  # run here, in the same workflow run, and only when an add-on release was just created.
  ci:
    name: CI
    needs: release-please
    if: ${{ needs.release-please.outputs.addon_released == 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Image veröffentlichen
    needs: [release-please, ci]
    if: ${{ needs.release-please.outputs.addon_released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout (Release-Commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image tag must equal `version` in config.yaml, otherwise Home Assistant cannot find the image.
      # config.yaml is the source of truth; Release Please has just bumped it in the release commit.
      - name: Version aus config.yaml
        id: version
        working-directory: meal-planner
        run: |
          version=$(sed -n 's/^version: "\([0-9][0-9A-Za-z.+-]*\)".*/\1/p' config.yaml)
          test -n "$version" || { echo "no version found in config.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: QEMU (für arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login bei ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build und Push (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./meal-planner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # HACS installs from the latest GitHub release of a repository, so add-on and integration releases
  # cannot share one repo there. The released component is copied into the mirror repo, which gets a
  # matching tag `vX.Y.Z` (its release-on-tag.yml turns that into a release). The mirror carries no
  # hand-made changes.
  mirror-integration:
    name: HACS-Mirror aktualisieren
    needs: release-please
    if: ${{ needs.release-please.outputs.integration_released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: integration-mirror
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      MIRROR_REPO: twostone/ha-meal-planner
      GIT_SSH_COMMAND: ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes
    steps:
      - name: Checkout (Release-Commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy-Key einrichten
        env:
          DEPLOY_KEY: ${{ secrets.INTEGRATION_MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf -- "%s\n" "$DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Mirror klonen und Stand kopieren
        run: |
          git clone --depth 1 "git@github.com:${MIRROR_REPO}.git" /tmp/mirror
          cd /tmp/mirror
          git rm -rq --ignore-unmatch custom_components .github/workflows
          mkdir -p custom_components .github/workflows
          cp -r "$GITHUB_WORKSPACE/custom_components/meal_planner" custom_components/
          rm -rf custom_components/meal_planner/__pycache__ custom_components/meal_planner/CHANGELOG.md custom_components/meal_planner/version.txt
          cp "$GITHUB_WORKSPACE/hacs.json" "$GITHUB_WORKSPACE/LICENSE" .
          cp "$GITHUB_WORKSPACE/.github/integration-mirror/README.md" README.md
          cp "$GITHUB_WORKSPACE/.github/integration-mirror/workflows/"*.yml .github/workflows/

      - name: Commit, Push und Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/meal_planner/manifest.json'))['version'])")
          # Idempotent: a re-run after a successful tag must not fail.
          if [ -n "$(git -C /tmp/mirror ls-remote --tags origin "refs/tags/v${version}")" ]; then
            echo "mirror tag v${version} already exists"
            exit 0
          fi
          gh release view "integration-v${version}" --json body --jq .body > /tmp/notes.md
          cd /tmp/mirror
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "mirror content already current"
          else
            git commit -m "Integration ${version} aus ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
            git push origin HEAD:main
          fi
          # Annotated tag; the message becomes the release notes. --cleanup=verbatim keeps lines starting with "#".
          git tag -a "v${version}" -F /tmp/notes.md --cleanup=verbatim
          git push origin "v${version}"
