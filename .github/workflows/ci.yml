name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # also used by release.yml, so a release only ships when this passes

permissions:
  contents: read

jobs:
  # App-Linter, Hadolint, npm test/check/build, Docker build amd64+arm64 and scripts/smoke.sh.
  ci:
    name: CI
    uses: twostone/hassio-workflows/.github/workflows/app-ci.yml@e8fa22248618d4114434940c6f7f44d77270e6ca # v1.0.0
    with:
      app-dir: meal-planner
      node-version: "24" # same major as the image (node:24-alpine); node:sqlite needs >= 22.13
