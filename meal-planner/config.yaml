# https://developers.home-assistant.io/docs/apps/configuration
name: Essensplanung
# Managed by Release Please (see release-please-config.json): do not edit the version by hand.
version: "0.15.0" # x-release-please-version
slug: essensplanung
description: Wöchentliche Essensplanung für den Haushalt
url: "https://github.com/twostone/meal-planner"
arch:
  - aarch64
  - amd64
# Prebuilt by the release workflow. No tag here: Home Assistant appends "version" as the tag.
image: ghcr.io/twostone/meal-planner
ingress: true
ingress_port: 8099
panel_icon: mdi:silverware-fork-knife
panel_title: Essensplanung
# Default is admin-only; the whole household should see it.
panel_admin: false
# Events go to Home Assistant through the Supervisor's Core proxy; the integration fetches the state
# from the second port (8100) with a token, announced once per start via Supervisor discovery.
homeassistant_api: true
discovery:
  - meal_planner
# Options land in /data/options.json (written by the Supervisor); a change needs a restart.
# log_level: how much the app writes to its log. ai_entity_*: AI task entity per task, unset = Home Assistant's preferred
# one. They are not under `options` so they stay unset; single quotes because "\." is no valid YAML escape.
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
  ai_entity_recipe: 'match(^ai_task\.[a-z0-9_]+$)?'
  ai_entity_titles: 'match(^ai_task\.[a-z0-9_]+$)?'
