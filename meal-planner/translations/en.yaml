configuration:
  log_level:
    name: Log level
    description: How much the app writes to its log.
  ai_entity_recipe:
    name: AI entity for ingredients (recognize and unify)
    description: >-
      Entity ID of an AI task, e.g. ai_task.openai_ai_task. Leave empty to use Home Assistant's preferred AI task.
      If the entity does not exist, the AI features are off (the log names the option).
  ai_entity_titles:
    name: AI entity for title suggestions
    description: >-
      Entity ID of an AI task, e.g. ai_task.google_ai_task. Leave empty to use Home Assistant's preferred AI task.
      If the entity does not exist, the AI features are off (the log names the option).
  ai_entity_image:
    name: AI entity for images
    description: >-
      Entity ID of an AI task that can generate images, e.g. ai_task.openai_ai_task. Leave empty to use Home
      Assistant's preferred AI task for images. If the entity does not exist, the AI features are off (the log names
      the option).
  mcp_app_url:
    name: MCP server – public address
    description: >-
      Optional. HTTPS address where your reverse proxy serves port 8101, e.g. https://meals.example.com. Leave empty
      to keep the MCP server off. Sign-in through Home Assistant (OAuth), see the README.
  mcp_ha_url:
    name: MCP server – public address of Home Assistant
    description: >-
      Optional. Leave empty to use the external URL from Home Assistant's network settings. MCP clients sign in there.
network:
  8101/tcp: MCP server (only with mcp_app_url, run it behind a TLS reverse proxy)
